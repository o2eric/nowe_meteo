name: Meteogram ICM
version: "0.1.0"
slug: icm_meteogram
description: >-
  Interaktywny meteogram godzinowy z modelu UM 4 km (ICM meteo.pl) — panel
  w bocznym menu + sensor z seriami prognozy. Nieoficjalne API, tylko polskie IP.
url: https://github.com/o2eric/nowe_meteo
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:chart-bell-curve-cumulative
panel_title: Meteogram ICM
options:
  location_name: ""
  model: um4_60
  update_minutes: 30
  publish_sensor: true
schema:
  location_name: str?
  latitude: float?
  longitude: float?
  model: list(um4_60|um4_120|gfs)
  update_minutes: int(10,180)
  publish_sensor: bool
