name: Meteogram (na podstawie ICM)
version: "0.7.0"
slug: icm_meteogram
description: >-
  Nieoficjalny meteogram godzinowy na podstawie danych ICM UW/meteo.pl
  (model UM 4 km) — panel + sensor. Projekt niezależny, niepowiązany z ICM.
url: https://github.com/o2eric/nowe_meteo
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:chart-bell-curve-cumulative
panel_title: Meteogram
options:
  location_name: ""
  model: um4_60
  update_minutes: 360
  publish_sensor: true
  publish_detail_sensors: true
  coffee_url: "https://buycoffee.to/o2eric"
  api_base: ""
schema:
  location_name: str?
  latitude: float?
  longitude: float?
  model: list(um4_60|um4_120|gfs)
  update_minutes: int(10,720)
  publish_sensor: bool
  publish_detail_sensors: bool?
  coffee_url: str?
  api_base: str?
