name: Meteogram ICM
version: "0.2.3"
slug: icm_meteogram
description: >-
  Nieoficjalny meteogram godzinowy (model UM 4 km, dane ICM UW/meteo.pl) —
  panel + sensor. Projekt niezależny, niepowiązany z ICM UW/meteo.pl.
url: https://github.com/o2eric/nowe_meteo
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:chart-bell-curve-cumulative
panel_title: Meteogram ICM
options:
  location_name: ""
  model: um4_60
  update_minutes: 30
  publish_sensor: true
  coffee_url: ""
schema:
  location_name: str?
  latitude: float?
  longitude: float?
  model: list(um4_60|um4_120|gfs)
  update_minutes: int(10,180)
  publish_sensor: bool
  coffee_url: str?
