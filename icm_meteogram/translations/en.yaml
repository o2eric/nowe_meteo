configuration:
  location_name:
    name: Location name
    description: >-
      Shown in the panel and sensor name. Empty = Home Assistant location name.
  latitude:
    name: Latitude
    description: >-
      Empty = your Home Assistant home coordinates. UM model covers Poland
      and surroundings.
  longitude:
    name: Longitude
    description: Empty = your Home Assistant home coordinates.
  model:
    name: Forecast model
    description: >-
      um4_60 (60 h, recommended), um4_120 (120 h), gfs (experimental, 240 h).
      Can also be switched in the panel (header drop-down).
  update_minutes:
    name: Refresh interval (minutes)
    description: >-
      10–720 min, default 360 (6 h). The UM model publishes a new run every
      6 h (um4_120: 12 h), so polling more often returns the same data and
      only loads the unofficial ICM API. Sensor state is still recalculated
      every full hour and the panel "Refresh" button fetches immediately.
  publish_sensor:
    name: Publish sensor
    description: >-
      Creates sensor.icm_meteogram (state = current temperature, forecast
      series in attributes — for ApexCharts and automations).
  publish_detail_sensors:
    name: Detail sensors
    description: >-
      One sensor.icm_* entity per ICM value for the current hour (pressure,
      dew point, cloud layers, cloud base, fog, storm, ...) with HA history.
      Requires "Publish sensor".
  background:
    name: Header background
    description: >-
      Animated scene behind the panel header, driven by the forecast for the
      current hour (time of day, season, clouds, precipitation, fog, storm,
      wind). krajobraz = sky + seasonal landscape, efekty = sky with effects,
      niebo = sky colour only, no animation, brak = classic look. Can be
      overridden per browser in the panel ("Tło" list).
  coffee_url:
    name: "Buy me a coffee link"
    description: >-
      Link of the "Buy me a coffee" button in the panel. Defaults to
      supporting the add-on author (buycoffee.to/o2eric). Clear it to hide
      the button.
  api_base:
    name: API base URL (advanced)
    description: >-
      ICM meteogram API host. Empty = https://devmgramapi.meteo.pl (the same
      host the www.meteo.pl website uses). Change only if ICM moves the API.
