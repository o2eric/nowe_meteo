configuration:
  location_name:
    name: Nazwa lokalizacji
    description: >-
      Wyświetlana w panelu i nazwie sensora (np. „Warszawa”). Puste = nazwa
      lokalizacji z Home Assistant.
  latitude:
    name: Szerokość geograficzna
    description: >-
      Puste = współrzędne domu z Home Assistant. Zasięg modelu UM: Polska
      i okolice.
  longitude:
    name: Długość geograficzna
    description: Puste = współrzędne domu z Home Assistant.
  model:
    name: Model prognozy
    description: >-
      um4_60 (60 h, zalecany), um4_120 (120 h), gfs (eksperymentalnie, 240 h).
      Model można też zmienić w panelu (lista w nagłówku).
  update_minutes:
    name: Odświeżanie (minuty)
    description: >-
      Jak często pobierać prognozę (10–720 min, domyślnie 360 = 6 h).
      Model UM liczy nowy bieg co 6 h (um4_120: co 12 h), więc częstsze
      pobieranie zwraca te same dane i tylko obciąża nieoficjalne API ICM.
      Stan sensorów i tak przelicza się co pełną godzinę, a przycisk
      „Odśwież” w panelu pobiera prognozę od razu.
  publish_sensor:
    name: Publikuj sensor
    description: >-
      Tworzy sensor.icm_meteogram (stan = temperatura teraz, serie prognozy
      w atrybutach — do ApexCharts i automatyzacji).
  publish_detail_sensors:
    name: Sensory szczegółowe
    description: >-
      Osobny sensor sensor.icm_* na każdą wartość ICM dla bieżącej godziny
      (ciśnienie, punkt rosy, piętra chmur, podstawa chmur, mgła, burza itd.)
      — z historią i wykresami w HA. Wymaga włączonego „Publikuj sensor".
  background:
    name: Tło nagłówka
    description: >-
      Scena w ruchu za nagłówkiem panelu, liczona z prognozy na bieżącą
      godzinę (pora dnia, pora roku, chmury, opad, mgła, burza, wiatr).
      krajobraz = niebo + krajobraz pory roku, efekty = niebo z efektami,
      niebo = sam kolor nieba bez animacji, brak = klasyczny wygląd.
      W panelu można to zmienić dla danej przeglądarki (lista „Tło”).
  coffee_url:
    name: Link „postaw kawę"
    description: >-
      Link przycisku „Postaw kawę” w panelu — domyślnie wsparcie autora
      add-onu (buycoffee.to/o2eric). Wyczyść pole, żeby ukryć przycisk.
  api_base:
    name: Adres API (zaawansowane)
    description: >-
      Host API meteogramów ICM. Puste = https://devmgramapi.meteo.pl (ten sam,
      z którego korzysta strona www.meteo.pl). Zmieniaj tylko, gdy ICM
      przeniesie API pod inny adres.
